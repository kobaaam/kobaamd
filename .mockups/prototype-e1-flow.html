<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway. 捨てる前提のコード。
  question: 「E1: 二段レール」で、セッション切替に伴いターミナル履歴・スコープ
            ファイルツリー・成果物ビューアが連動して入れ替わる動線は気持ちいいか？
  方針メモ: prototype skill の UI.md は複数バリアント比較用だが、E1 に既に収束済みの
            ため比較はせず、E1 単一の「触れる動線」検証に振っている（意図的な逸脱）。
  セッション = git worktree 単位（確定）。ツリーは worktree にスコープ、横断探索なし。
  one command to run: open .mockups/prototype-e1-flow.html
  no persistence: 状態は全てメモリ（リロードで消える）。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>kobaamd E1 動線プロトタイプ</title>
<style>
  :root{
    --bg:#1e1e22; --bg2:#26262b; --bg3:#2d2d33; --border:#3a3a42;
    --text:#e4e4ea; --dim:#8c8c98; --accent:#6ea8fe; --green:#5fd38d;
    --red:#f0788c; --yellow:#f0c674; --term:#16161a; --termtext:#cfcfd8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,"SF Pro Text",sans-serif;background:#0e0e10;color:var(--text);-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .topnote{flex:0 0 auto;padding:8px 16px;font-size:11.5px;color:var(--dim);background:#0a0a0c;border-bottom:1px solid var(--border)}
  .topnote b{color:var(--green)}
  .win{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  .titlebar{flex:0 0 38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#2a2a30;border-bottom:1px solid var(--border)}
  .traffic{display:flex;gap:8px}.traffic i{width:12px;height:12px;border-radius:50%;display:block}
  .traffic .r{background:#ff5f57}.traffic .y{background:#febc2e}.traffic .g{background:#28c840}
  .titlebar .doc{margin-left:10px;font-size:12.5px;color:var(--dim)}.titlebar .doc b{color:var(--text)}
  .body{flex:1 1 auto;display:flex;min-height:0}

  /* left rail (two stacked sections) */
  .rail{flex:0 0 240px;background:#1a1a1f;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .railhead{padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
  .railhead .plus{font-size:16px;cursor:pointer;color:var(--dim);line-height:1}
  .railhead .plus:hover{color:var(--green)}
  .sesslist{flex:0 0 auto;max-height:42%;overflow:auto}
  .sess{padding:9px 12px;border-radius:8px;margin:2px 8px;cursor:pointer}
  .sess:hover{background:var(--bg2)}
  .sess.sel{background:rgba(95,211,141,.14);box-shadow:inset 2px 0 0 var(--green)}
  .sess .r1{display:flex;align-items:center;gap:7px;font-size:12.5px}
  .sess .stat{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .sess .stat.run{background:var(--green);box-shadow:0 0 6px var(--green)}
  .sess .stat.wait{background:var(--yellow)} .sess .stat.idle{background:var(--dim)}
  .sess .r2{display:flex;gap:6px;margin-top:5px;padding-left:14px}
  .chip{font-size:10px;padding:1px 7px;border-radius:20px;background:var(--bg3);color:var(--dim)}
  .chip.art{background:rgba(110,168,254,.16);color:var(--accent)}
  .railsplit{border-top:1px solid var(--border)}
  .scope{text-transform:none;color:var(--accent)}
  .tree{flex:1 1 auto;overflow:auto;padding:4px 6px 8px;font-size:12.5px}
  .titem{padding:4px 10px;border-radius:6px;color:var(--dim);cursor:pointer;display:flex;gap:7px;align-items:center}
  .titem:hover{background:var(--bg2)} .titem.sel{background:rgba(110,168,254,.16);color:var(--text)}
  .titem.indent{padding-left:24px} .titem .new{margin-left:auto;font-size:9px;background:var(--green);color:#08121f;padding:0 6px;border-radius:20px}
  .railfoot{flex:0 0 auto;padding:8px 12px;font-size:10.5px;color:var(--dim);border-top:1px solid var(--border)}

  /* terminal */
  .pane{display:flex;flex-direction:column;min-width:0;min-height:0}
  .panehead{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:11.5px;color:var(--dim);background:var(--bg2);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.6px}
  .panehead .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .termwrap{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;background:var(--term)}
  .term{flex:1 1 auto;overflow:auto;padding:14px 16px;font-family:"SF Mono",Menlo,monospace;font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--termtext)}
  .term .p{color:var(--green)} .term .path{color:var(--accent)} .term .dim{color:var(--dim)} .term .ok{color:var(--green)} .term .warn{color:var(--yellow)}
  .terminput{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 16px;border-top:1px solid var(--border);background:#101015}
  .terminput .p{color:var(--green);font-family:"SF Mono",Menlo,monospace;font-size:12.5px}
  .terminput input{flex:1;background:transparent;border:none;outline:none;color:var(--termtext);font-family:"SF Mono",Menlo,monospace;font-size:12.5px}
  .divider{flex:0 0 1px;background:var(--border)}

  /* viewer */
  .viewer{flex:1 1 0;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
  .tabs{flex:0 0 auto;display:flex;gap:2px;padding:6px 10px 0;background:var(--bg2);border-bottom:1px solid var(--border)}
  .tab{font-size:12px;padding:7px 13px;border-radius:8px 8px 0 0;color:var(--dim);cursor:pointer;border:1px solid transparent;border-bottom:none}
  .tab.active{background:var(--bg);color:var(--text);border-color:var(--border)}
  .vbody{flex:1 1 auto;overflow:auto;padding:22px 26px}
  .md h1{font-size:22px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .md h2{font-size:16px;margin:18px 0 8px} .md p{font-size:13.5px;line-height:1.75;color:#d2d2da;margin-bottom:12px}
  .md ul{margin:0 0 14px 20px} .md li{font-size:13.5px;line-height:1.8;color:#d2d2da}
  .md code{background:var(--bg3);padding:2px 6px;border-radius:5px;font-family:"SF Mono",Menlo,monospace;font-size:12px}
  .diff{font-family:"SF Mono",Menlo,monospace;font-size:12px;line-height:1.7}
  .diff .l{display:block;padding:0 10px} .diff .add{background:rgba(95,211,141,.12);color:var(--green)} .diff .del{background:rgba(240,120,140,.12);color:var(--red)} .diff .meta{color:var(--dim)}
  .d2{display:flex;gap:24px;align-items:center;justify-content:center;padding:30px;flex-wrap:wrap}
  .d2 .node{background:var(--bg2);border:1px solid var(--accent);border-radius:10px;padding:16px 22px;font-size:13px;text-align:center}
  .d2 .arrow{color:var(--accent);font-size:20px}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding-top:60px}

  /* state inspector */
  .inspector{flex:0 0 auto;background:#0a0a0c;border-top:1px solid var(--border);padding:7px 16px;font-family:"SF Mono",Menlo,monospace;font-size:11px;color:var(--dim)}
  .inspector b{color:var(--accent)}
</style>
</head>
<body>
<div class="topnote">🧪 <b>PROTOTYPE</b> — E1動線検証。左の<b>セッションをクリック</b>すると ターミナル/ツリー/ビューアが連動して入れ替わる。ターミナル下部で <code style="color:var(--green)">claude "..."</code> を打つと成果物が生成されツリーに出る。リロードで消えます。</div>
<div class="win">
  <div class="titlebar">
    <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <span class="doc">kobaamd — <b id="winTitle">…</b></span>
  </div>
  <div class="body">
    <!-- left rail -->
    <div class="rail">
      <div class="railhead"><span>Sessions</span><span class="plus" id="addSess" title="新規セッション(worktree)">＋</span></div>
      <div class="sesslist" id="sessList"></div>
      <div class="railsplit"></div>
      <div class="railhead"><span>Files <span class="scope" id="scopeLabel"></span></span></div>
      <div class="tree" id="tree"></div>
      <div class="railfoot">worktree: <span id="cwd" style="color:var(--accent)"></span><br>⌘P で全文ファジー検索（稀な横断用）</div>
    </div>
    <!-- terminal -->
    <div class="pane" style="flex:1 1 46%">
      <div class="panehead"><span class="dot"></span><span id="termHead">Terminal</span></div>
      <div class="termwrap">
        <div class="term" id="term"></div>
        <div class="terminput"><span class="p">➜</span><input id="cmd" placeholder='claude "…" と打って Enter（成果物が生成されます）' autocomplete="off"></div>
      </div>
    </div>
    <div class="divider"></div>
    <!-- viewer -->
    <div class="pane viewer" style="flex:1 1 40%">
      <div class="tabs" id="tabs"></div>
      <div class="vbody" id="vbody"></div>
    </div>
  </div>
  <div class="inspector" id="inspector"></div>
</div>

<script>
/* ---------- in-memory model ---------- */
const md = (s)=>s; // identity; content authored as HTML below for speed
function mkSession(o){ return Object.assign({activeFile:0, activeTab:0}, o); }

let sessions = [
  mkSession({
    name:"PRD: Feature X", status:"run", cwd:"~/wt/feature-x",
    term:[
      ['p','➜ '],['path','feature-x'],['',' claude "PRDをmdで書いて"\n'],
      ['dim','● 要件を整理しています…\n'],
      ['ok','✓'],['',' docs/prd-feature-x.md を生成\n'],
      ['ok','✓'],['',' docs/architecture.d2 を生成\n'],
    ],
    files:[
      {name:"docs/prd-feature-x.md", icon:"📄", indent:true, tabs:[
        ['📄 Preview','md',`<div class="md"><h1>Feature X PRD</h1><h2>背景</h2><p>セッション(worktree)ごとに作業文脈が独立し、成果物をその場でレンダリング確認できる。</p><h2>受入条件</h2><ul><li>mdを保存すると右ペインが自動再描画</li><li><code>.d2</code>は図としてレンダリング</li><li>diffタブで直近変更を確認</li></ul></div>`],
      ]},
      {name:"docs/architecture.d2", icon:"📐", indent:true, tabs:[
        ['📐 Diagram','d2',`<div class="d2"><div class="node">Terminal<br>(操作)</div><div class="arrow">→</div><div class="node">Agent<br>(claude/codex)</div><div class="arrow">→</div><div class="node">Viewer<br>(成果物)</div></div>`],
      ]},
      {name:"docs/notes.md", icon:"📄", indent:true, tabs:[
        ['📄 Preview','md',`<div class="md"><h1>メモ</h1><p>worktreeスコープのツリーなのでノイズが少ない。</p></div>`],
      ]},
    ],
    treeRoots:["📁 docs","📁 src","📄 README.md"],
  }),
  mkSession({
    name:"実装: 認証まわり", status:"wait", cwd:"~/wt/auth",
    term:[
      ['p','➜ '],['path','auth'],['',' claude "ログイン実装してPR"\n'],
      ['ok','✓'],['',' AuthService.swift 編集 (+38 -4)\n'],
      ['ok','✓'],['',' swift test … '],['ok','passed (12)\n'],
      ['warn','⤷ レビュー待ち。右のdiffを確認 →\n'],
    ],
    files:[
      {name:"src/AuthService.swift", icon:"⚙", indent:true, tabs:[
        ['± Diff','diff',`<div class="diff"><span class="l meta">src/AuthService.swift</span><span class="l add">+ func login(_ u:User) async throws {</span><span class="l add">+   try await api.authenticate(u)</span><span class="l add">+ }</span><span class="l del">- // TODO: auth</span></div>`],
      ]},
      {name:"PR #143", icon:"🔀", indent:true, tabs:[
        ['📄 PR本文','md',`<div class="md"><h1>feat: login flow</h1><p>認証フローを追加。テスト12件pass。</p></div>`],
      ]},
    ],
    treeRoots:["📁 src","📄 README.md"],
  }),
  mkSession({
    name:"調査: D2構成図", status:"idle", cwd:"~/wt/research",
    term:[
      ['p','➜ '],['path','research'],['',' claude "システム構成をD2で"\n'],
      ['ok','✓'],['',' diagram.d2 を生成\n'],
    ],
    files:[
      {name:"diagram.d2", icon:"📐", indent:true, tabs:[
        ['📐 Diagram','d2',`<div class="d2"><div class="node">Client</div><div class="arrow">→</div><div class="node">API</div><div class="arrow">→</div><div class="node">DB</div></div>`],
      ]},
    ],
    treeRoots:["📄 diagram.d2"],
  }),
];
let cur = 0;

/* ---------- render ---------- */
const $=(id)=>document.getElementById(id);
function S(){ return sessions[cur]; }

function renderSessions(){
  $("sessList").innerHTML = sessions.map((s,i)=>`
    <div class="sess ${i===cur?'sel':''}" data-i="${i}">
      <div class="r1"><span class="stat ${s.status}"></span>${s.name}</div>
      <div class="r2"><span class="chip art">${s.files.length} 成果物</span>${s.status==='wait'?'<span class="chip">要確認</span>':''}</div>
    </div>`).join("");
  $("sessList").querySelectorAll(".sess").forEach(el=>el.onclick=()=>selectSession(+el.dataset.i));
}
function renderTree(){
  const s=S();
  $("scopeLabel").textContent = "· "+s.name;
  $("cwd").textContent = s.cwd;
  // roots + files (files shown indented as if under docs/src)
  let html = "";
  const fileSet = s.files.map((f,i)=>({f,i}));
  s.treeRoots.forEach(root=>{
    html += `<div class="titem">${root}</div>`;
    fileSet.filter(x=>x.f.name.startsWith(root.replace(/^📁 /,'')) && x.f.name!==root.replace(/^📄 /,''))
      .forEach(x=>{ html+=fileRow(x.f,x.i); });
  });
  // any files not under a root (e.g. PR, top-level)
  fileSet.filter(x=>!s.treeRoots.some(r=>x.f.name.startsWith(r.replace(/^📁 /,'').replace(/^📄 /,'')) ))
    .forEach(x=>{ if(!s.treeRoots.includes("📄 "+x.f.name)) html+=fileRow(x.f,x.i,false); });
  $("tree").innerHTML = html;
  $("tree").querySelectorAll(".titem[data-f]").forEach(el=>el.onclick=()=>selectFile(+el.dataset.f));
}
function fileRow(f,i,indent=true){
  const sel = i===S().activeFile?'sel':'';
  return `<div class="titem ${indent?'indent':''} ${sel}" data-f="${i}">${f.icon} ${f.name.split('/').pop()}${f.new?'<span class="new">NEW</span>':''}</div>`;
}
function renderTerm(){
  const s=S();
  $("termHead").textContent = "Terminal — "+s.name;
  $("term").innerHTML = s.term.map(([c,t])=>c?`<span class="${c}">${t}</span>`:t).join("") + '<span class="p">➜ </span><span class="path">'+s.cwd.split('/').pop()+'</span> ';
  $("term").scrollTop = $("term").scrollHeight;
}
function renderViewer(){
  const s=S();
  const f=s.files[s.activeFile];
  if(!f){ $("tabs").innerHTML=""; $("vbody").innerHTML='<div class="empty">ファイルを選択してください</div>'; return; }
  if(s.activeTab>=f.tabs.length) s.activeTab=0;
  $("tabs").innerHTML = f.tabs.map((t,i)=>`<div class="tab ${i===s.activeTab?'active':''}" data-t="${i}">${t[0]}</div>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(el=>el.onclick=()=>{S().activeTab=+el.dataset.t;renderViewer();renderInspector();});
  $("vbody").innerHTML = f.tabs[s.activeTab][2];
}
function renderInspector(){
  const s=S();
  const f=s.files[s.activeFile];
  $("inspector").innerHTML = `state ▸ session=<b>${cur}:${s.name}</b> · worktree=<b>${s.cwd}</b> · files=<b>${s.files.length}</b> · activeFile=<b>${f?f.name:'—'}</b> · tab=<b>${f?f.tabs[s.activeTab][0]:'—'}</b>`;
}
function renderAll(){ $("winTitle").textContent=S().name; renderSessions();renderTree();renderTerm();renderViewer();renderInspector(); }

/* ---------- actions ---------- */
function selectSession(i){ cur=i; if(S().activeFile>=S().files.length)S().activeFile=0; renderAll(); }
function selectFile(i){ S().activeFile=i; S().activeTab=0; S().files[i].new=false; renderTree();renderViewer();renderInspector(); }

$("addSess").onclick=()=>{
  const n=sessions.length+1;
  sessions.push(mkSession({name:"新規セッション "+n, status:"idle", cwd:"~/wt/new-"+n,
    term:[['dim','● 新しい worktree を作成しました\n']], files:[], treeRoots:[]}));
  cur=sessions.length-1; renderAll();
};

$("cmd").addEventListener("keydown",(e)=>{
  if(e.key!=="Enter"||!e.target.value.trim())return;
  const s=S(), cmd=e.target.value.trim(); e.target.value="";
  s.term.push(['','\n'],['p','➜ '],['path',s.cwd.split('/').pop()],['',' '+cmd+'\n']);
  // fake artifact generation when it's a claude/codex command
  if(/claude|codex/.test(cmd)){
    const fname = "docs/generated-"+(s.files.length+1)+".md";
    s.term.push(['dim','● 生成中…\n'],['ok','✓'],['',' '+fname+' を生成\n']);
    s.files.push({name:fname, icon:"📄", indent:true, new:true, tabs:[
      ['📄 Preview','md',`<div class="md"><h1>生成された成果物 #${s.files.length+1}</h1><p>コマンド <code>${cmd}</code> から生成。左ツリーに即追加され、ここに表示される。</p></div>`],
    ]});
    if(!s.treeRoots.includes("📁 docs")) s.treeRoots.unshift("📁 docs");
    s.activeFile=s.files.length-1; s.activeTab=0;
  }else{
    s.term.push(['dim','(ローカルコマンドはこのプロトでは実行されません)\n']);
  }
  renderAll();
});

document.addEventListener("keydown",(e)=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowDown"){selectSession((cur+1)%sessions.length);}
  if(e.key==="ArrowUp"){selectSession((cur-1+sessions.length)%sessions.length);}
});

renderAll();
</script>
</body>
</html>
