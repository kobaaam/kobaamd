name: Unit Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run all unit tests
        run: |
          set -euo pipefail
          chmod +x ./scripts/run-unit-tests.sh
          ./scripts/run-unit-tests.sh

  benchmarks:
    runs-on: macos-15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RUN_BENCHMARKS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run benchmarks
        run: |
          set -euo pipefail
          chmod +x ./scripts/run-unit-tests.sh
          ./scripts/run-unit-tests.sh --filter Benchmarks
