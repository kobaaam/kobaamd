name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      KOBAAMD_SU_PUBLIC_ED_KEY: ${{ secrets.SU_PUBLIC_ED_KEY }}
      SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Mask secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$KOBAAMD_SU_PUBLIC_ED_KEY"
          echo "::add-mask::$SPARKLE_EDDSA_PRIVATE_KEY"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(git describe --tags --exact-match | sed 's/^v//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release

      - name: Post-build signing prep
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/post-build.sh release

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          hdiutil create -volname "kobaamd" -srcfolder ".build/kobaamd.app" -ov -format UDZO "kobaamd-${VERSION}.dmg"

      - name: Sign DMG with Sparkle EdDSA
        id: sparkle_sign
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DMG="kobaamd-${VERSION}.dmg"
          SIGN_UPDATE=$(find .build -name "sign_update" -type f | head -1)
          if [ -z "$SIGN_UPDATE" ]; then
            echo "sign_update not found under .build" >&2
            exit 1
          fi

          KEY_FILE=$(mktemp)
          cleanup() {
            rm -f "$KEY_FILE"
          }
          trap cleanup EXIT

          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" > "$KEY_FILE"
          # sign_update outputs either:
          #   (a) a bare Base64 EdDSA signature string, or
          #   (b) XML-attribute style: sparkle:edSignature="..."
          # Extract the Base64 string from either form.
          SIGN_OUTPUT=$("$SIGN_UPDATE" --ed-key-file "$KEY_FILE" "$DMG")
          SIGNATURE=$(printf '%s' "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          if [ -z "$SIGNATURE" ]; then
            # Assume bare Base64 output; strip any surrounding whitespace
            SIGNATURE=$(printf '%s' "$SIGN_OUTPUT" | tr -d '[:space:]')
          fi
          if [ -z "$SIGNATURE" ]; then
            echo "Empty EdDSA signature returned by sign_update" >&2
            exit 1
          fi

          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"

      - name: Capture DMG metadata
        id: dmg_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DMG="kobaamd-${VERSION}.dmg"
          LENGTH=$(stat -f%z "$DMG")
          echo "length=$LENGTH" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG" >> "$GITHUB_OUTPUT"
          echo "dmg_url=https://github.com/kobaaam/kobaamd/releases/download/v${VERSION}/${DMG}" >> "$GITHUB_OUTPUT"

      - name: Generate appcast.xml
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ./scripts/generate-appcast.sh \
            "$VERSION" \
            "${{ steps.dmg_meta.outputs.dmg_url }}" \
            "${{ steps.sparkle_sign.outputs.signature }}" \
            "${{ steps.dmg_meta.outputs.length }}"

      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" "${{ steps.dmg_meta.outputs.dmg_name }}" \
            --title "v${VERSION}" \
            --notes "リリース v${VERSION}" \
            --draft=false

      - name: Commit and push appcast.xml to main
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APPCAST_TMP=$(mktemp)
          cp appcast.xml "$APPCAST_TMP"
          rm -f appcast.xml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp "$APPCAST_TMP" appcast.xml
          rm -f "$APPCAST_TMP"

          git add appcast.xml
          git commit -m "chore: update appcast.xml for v${VERSION} [skip ci]"
          git push origin HEAD:main

      - name: Roll back failed release
        if: failure() && steps.version.outputs.version != ''
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "v${{ steps.version.outputs.version }}" --yes || true
