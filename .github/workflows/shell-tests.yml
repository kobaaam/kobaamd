name: Shell Tests

on:
  push:
    paths:
      - '.claude/agents/kobaamd_lint_section_context.md'
      - 'docs/wiki/articles/practices/wiki-reference-policy.md'
      - 'scripts/run_e2e_tests.sh'
      - 'scripts/hooks/pre-commit'
      - 'scripts/usage/**'
      - 'scripts/wiki/**'
      - 'Tests/usage/**'
      - 'Tests/wiki/**'
      - '.github/workflows/shell-tests.yml'
  pull_request:
    paths:
      - '.claude/agents/kobaamd_lint_section_context.md'
      - 'docs/wiki/articles/practices/wiki-reference-policy.md'
      - 'scripts/run_e2e_tests.sh'
      - 'scripts/hooks/pre-commit'
      - 'scripts/usage/**'
      - 'scripts/wiki/**'
      - 'Tests/usage/**'
      - 'Tests/wiki/**'
      - '.github/workflows/shell-tests.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y jq python3

      - name: Run section-context-check smoke test
        run: bash Tests/wiki/section-context-check.smoke.sh

      - name: Run section-context allowlist test
        run: bash Tests/wiki/section-context-allowlist.sh

      - name: Run allowlist drift verification test
        run: bash Tests/wiki/verify-allowlist-drift.sh

      - name: Run usage check smoke test
        run: bash Tests/usage/check.smoke.sh

      - name: Run wiki lint smoke test
        run: bash Tests/wiki/lint.smoke.sh
